<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check how a news article reads and what a photo's pixels show, with every limit of the model stated next to the result." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Deepfake News Detection System</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      try {
        var t = localStorage.getItem("ddn.theme") || "system";
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
