# Serves the built interface and forwards /api to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The application limits images to 10 MB and videos to MAX_VIDEO_MB (100 MB by default); leave headroom for the multipart
    # envelope. If you raise MAX_VIDEO_MB, raise this too, otherwise nginx answers with its own error page.
    client_max_body_size 110m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Video analysis on a CPU can take minutes, and the upload itself can be slow.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Hashed build files never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path is handled by the router in the browser.
    location / {
        try_files $uri /index.html;
    }
}
